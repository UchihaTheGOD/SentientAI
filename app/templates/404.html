{% extends "base_public.html" %}
{% block title %}Page not found — Sentient{% endblock %}

{% block content %}
<div class="container container--narrow error-page">
    <p class="error-code">404</p>
    <h1 class="error-title">We couldn't find that page</h1>
    <p class="error-text">
        The link may be broken, or the post may have been moved, unpublished or deleted.
    </p>
    <div class="error-actions">
        <a href="/" class="btn btn-primary">Back home</a>
        <a href="/explore" class="btn btn-outline">Browse posts</a>
    </div>
</div>
{% endblock %}
