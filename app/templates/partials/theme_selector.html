<div class="theme-selector" data-theme-selector aria-label="Theme">
  <span class="sr-only">Theme</span>
  <span class="theme-label" aria-hidden="true" title="Theme">◐</span>
  <div class="theme-opts" role="group" aria-label="Theme: System, Light, Dark">
    <button type="button" class="theme-opt" data-theme-value="system" aria-pressed="false" aria-label="System theme">System</button>
    <button type="button" class="theme-opt" data-theme-value="light" aria-pressed="false" aria-label="Light theme">Light</button>
    <button type="button" class="theme-opt" data-theme-value="dark" aria-pressed="false" aria-label="Dark theme">Dark</button>
  </div>
  <span class="theme-current sr-only" data-theme-current>System</span>
</div>
