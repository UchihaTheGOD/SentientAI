{% extends "base_public.html" %}
{% set user = None %}
{% block title %}Sign In — SentientAI{% endblock %}

{% block content %}
<div class="container">
    <div class="auth-container">
        <h1>Sign In</h1>
        <p class="subtitle">Welcome back to SentientAI.</p>

        {% if error %}
        <div class="alert alert-error">{{ error }}</div>
        {% endif %}

        {% if message %}
        <div class="alert alert-success" data-dismiss>{{ message }}</div>
        {% endif %}

        <div class="card">
            <form method="post" action="/login">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" class="form-control" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" class="form-control" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%;">Sign In</button>
            </form>
        </div>

        <p class="auth-footer">Don't have an account? <a href="/register">Register</a></p>
    </div>
</div>
{% endblock %}
